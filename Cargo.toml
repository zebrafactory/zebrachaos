[package]
name = "zf-zebrachaos"
version = "0.0.1-rc.0"
edition = "2024"
rust-version = "1.99"
description = """
🦓 🤪 ZebraChaos is a Content Hash Addressable Object Store. It's a lot like Git.
"""
license = "MIT OR Apache-2.0"
authors = ["Jason Gerard DeRose <jasonderose@gmail.com>"]
documentation = "https://docs.rs/zf-zebrachaos"
repository = "https://github.com/zebrafactory/zebrachaos"
keywords = ["awesomeness"]
categories = ["cryptography", "filesystem"]

[dependencies]
arrayvec = "0.7.8"
blake2 = "0.11.0"
subtle = "2.6.1"

[features]
nightly = []

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
getrandom = "0.4.3"
tempfile = "3.27.0"
